name: Patch Mah Buddy study controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch study controls and app navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()

          # The requested levels are Easy / Normal / Hard.
          s=s.replace('useState("Medium")','useState("Normal")')
          s=s.replace('<option>Medium</option>','<option>Normal</option>')

          # Keep Settings and Profile as real app screens with their own functional routes.
          old='function nav(s:Screen){stopSpeaking();setScreen(s);setDrawer(false);if(s!=="chat"&&s!=="flashcards"&&s!=="quiz")setInput("")}'
          new='function nav(s:Screen){stopSpeaking();setDrawer(false);if(s==="profile"){window.location.href="/profile";return}if(s==="settings"){window.location.href="/settings";return}setScreen(s);if(s!=="chat"&&s!=="flashcards"&&s!=="quiz")setInput("")}'
          if old in s:s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Use Easy Normal Hard and activate profile settings navigation'
          git push
